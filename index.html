<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excellentia Timetable Builder</title>
<style>
:root{--bg:#f6f7fb;--fg:#1b2030;--card:#fff;--mut:#667;--pri:#1e5eff;--bad:#c62828;--ok:#1b7f3b;--bd:#dde1ec;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10131c;--fg:#e8ebf5;--card:#1a1f2e;--mut:#9aa3b8;--pri:#6c9bff;--bad:#ff7b72;--ok:#4cc38a;--bd:#2c3347;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;background:linear-gradient(135deg,#6a11cb 0%,#2575fc 30%,#00c6a7 65%,#ffb347 100%) fixed;color:var(--fg);font:15px/1.4 system-ui,sans-serif}
header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}h3{margin:6px 0}small{color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px}nav button{white-space:nowrap}
button,select,input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button.p{background:linear-gradient(135deg,#7b2ff7,#1e5eff);color:#fff;border-color:transparent}button.on{background:#fff3c4;border-color:#ffb300;color:#6b4200;font-weight:700}button:disabled{opacity:.45}
main{padding:0 14px 30px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row input{width:100%}.half input{width:48%}
label.c{display:inline-flex;gap:4px;align-items:center;margin:3px 8px 3px 0;font-size:13px}label.c input{width:auto}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px;font-size:12px}th,td{border:1px solid var(--bd);padding:4px;text-align:center;vertical-align:top}td{height:44px}th{background:linear-gradient(135deg,rgba(123,47,247,.18),rgba(0,198,167,.18))}tr.br td{background:var(--bd);color:var(--mut);height:auto;font-size:11px}
#msg{margin:8px 14px;font-weight:600;background:var(--card);padding:8px 12px;border-radius:10px}#msg:empty{display:none}.bad{color:var(--bad)}.ok{color:var(--ok)}
.pt,#pa{display:none}
@page{size:landscape;margin:10mm}
@media print{:root{--card:#fff;--fg:#000;--bd:#999;--mut:#333}body{background:#fff!important;color:#000}header,nav,#msg,.row,.noprint{display:none!important}.card{box-shadow:none;border:0;padding:0}.pt{display:block!important}table{min-width:0}th{background:#eee!important}.sg{margin-top:14px}body.pall main{display:none}body.pall #pa{display:block}.pg{page-break-after:always}}
.ph{text-align:center;margin:4px 0 8px}.ph h2{color:#b0242f;margin:4px 0;font-size:18px;font-family:Georgia,serif}.lg{height:54px}
.tt{position:relative}.tt table{min-width:900px;font-family:Georgia,serif}.tt th{background:#b0242f!important;color:#fff;font-size:11px}.tt td{font-size:11px}
.tt td.dy{background:#f4d5d8;color:#000;font-weight:700}.tt td.bk{background:#f4d5d8;color:#b0242f}.tt td.fx{background:#dff0d8;color:#1b6b2a}.tt small{color:inherit;opacity:.85}
.wm{position:absolute;left:50%;top:50%;width:34%;transform:translate(-50%,-50%);opacity:.1;pointer-events:none}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<header><h1>Excellentia Timetable Builder</h1><button id="out" style="display:none" onclick="sb.auth.signOut().then(()=>location.reload())">Log out</button></header>
<div id="msg"></div><nav id="nav"></nav><main id="m"></main><div id="pa"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://gbklrppwekfdgjxlkakk.supabase.co','sb_publishable_rPRyA-2oZlE455wn_NA66w_ITWA7Gm8');
const $=id=>document.getElementById(id),DAYS=['Mon','Tue','Wed','Thu','Fri'];
const D={arms:[],subj:[],staff:[],qual:[],alloc:[],per:[],fix:[],term:[],ver:[],ent:[],av:[]};
const S={mode:'class',tid:null,tab:'staff',arm:null,ver:null,sj:null,res:null};
const msg=(t,bad)=>{$('msg').textContent=t;$('msg').className=bad?'bad':'ok'};
async function q(p){const r=await p;if(r.error){msg(r.error.message,1);throw r.error}return r.data}
async function load(){
 [D.arms,D.subj,D.staff,D.qual,D.alloc,D.per,D.fix,D.term,D.ver,D.av]=await Promise.all([
 q(sb.from('class_arms').select('*').order('id')),q(sb.from('subjects').select('*').order('name')),q(sb.from('staff').select('*').order('id')),
 q(sb.from('teacher_qualifications').select('*')),q(sb.from('class_subject_alloc').select('*').range(0,999)),q(sb.from('period_defs').select('*').order('start_min')),
 q(sb.from('fixed_slots').select('*')),q(sb.from('terms').select('*')),q(sb.from('timetable_versions').select('*').order('id',{ascending:false})),q(sb.from('teacher_availability').select('*'))]);
 D.set=(await q(sb.from('school_settings').select('*')))[0];D.ses=await q(sb.from('academic_sessions').select('*'));if(!S.tid)S.tid=D.staff[0]?.id;if(!S.arm)S.arm=D.arms[0]?.id;if(!S.sj)S.sj=D.subj[0]?.id;if(!S.ver&&D.ver[0])S.ver=D.ver[0].id;
 D.ent=S.ver?await q(sb.from('weekly_entries').select('*').eq('version_id',S.ver).range(0,999)):[];draw()}
function loginUI(){$('nav').innerHTML='';$('m').innerHTML=`<div class="card"><h3>Log in</h3><div class="row"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="p" onclick="login()">Log in</button></div></div>`}
async function login(){const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)return msg(r.error.message,1);msg('');start()}
async function start(){$('out').style.display='';await load()}
const lessonP=()=>D.per.filter(p=>p.kind=='lesson');
const nm=id=>D.staff.find(s=>s.id==id)?.initials||D.staff.find(s=>s.id==id)?.full_name||'?';
const code=id=>D.subj.find(s=>s.id==id)?.code,sn=id=>D.subj.find(s=>s.id==id)?.name;
async function addStaff(){const v=i=>$(i).value.trim();if(!v('sn')||!v('fn'))return msg('Staff ID and full name are required',1);
 const [s]=await q(sb.from('staff').insert({staff_no:v('sn'),full_name:v('fn'),initials:v('ini')||null,max_periods_day:+v('md')||6,max_periods_week:+v('mw')||26}).select());
 const ids=[...document.querySelectorAll('.sj:checked')].map(c=>+c.value);
 if(ids.length)await q(sb.from('teacher_qualifications').insert(ids.map(i=>({staff_id:s.id,subject_id:i}))));
 msg('Saved '+v('fn'));await load()}
function pick(sec){document.querySelectorAll('.ar').forEach(c=>c.checked=sec=='all'?false:c.dataset.s==sec)}
async function saveAlloc(){const sid=+$('asj').value,tid=+$('ate').value,ppw=+$('ppw').value,db=+$('dbl').value||0;
 const arms=[...document.querySelectorAll('.ar:checked')].map(c=>+c.value);
 if(!tid||!arms.length||!ppw)return msg('Choose a teacher, at least one class and periods per week',1);
 await q(sb.from('class_subject_alloc').upsert(arms.map(a=>({arm_id:a,subject_id:sid,staff_id:tid,periods_per_week:ppw,double_blocks:db})),{onConflict:'arm_id,subject_id'}));
 msg('Saved '+arms.length+' allocations');await load()}
async function mkTerm(){const [a]=await q(sb.from('academic_sessions').insert({name:'2026/2027',is_current:true}).select());
 await q(sb.from('terms').insert({session_id:a.id,name:'First Term',start_date:'2026-09-14',end_date:'2026-12-18'}));msg('Term created');await load()}
function gen(){const lp=lessonP(),n=lp.length,st=Object.fromEntries(D.staff.map(s=>[s.id,s])),armOf=Object.fromEntries(D.arms.map(a=>[a.id,a]));
 const fx=(a,d,i)=>D.fix.some(f=>f.day==d&&(!f.level_id||f.level_id==armOf[a].level_id)&&lp[i].period_no==f.period_no);
 const un=(s,d,i)=>D.av.some(x=>x.staff_id==s&&x.kind=='unavailable'&&x.day==d&&x.start_min<lp[i].end_min&&x.end_min>lp[i].start_min);
 const L=[],skipped=[];D.alloc.forEach(a=>{if(!a.staff_id){skipped.push(a);return}for(let k=0;k<a.double_blocks;k++)L.push({...a,len:2});for(let k=0;k<a.periods_per_week-2*a.double_blocks;k++)L.push({...a,len:1})});
 let best=null;
 for(let t=0;t<40;t++){const cb=new Set,tb=new Set,td={},tw={},sd=new Set,E=[],miss=[];
  const Q=L.map(x=>x).sort(()=>Math.random()-.5).sort((x,y)=>y.len-x.len);
  for(const l of Q){const sf=st[l.staff_id],md=sf.max_periods_day||99,mw=sf.max_periods_week||99;let bs=1e9,bd,bi;
   if((tw[l.staff_id]||0)+l.len<=mw)for(let d=1;d<=5;d++){const dn=td[l.staff_id+':'+d]||0;if(dn+l.len>md)continue;
    for(let i=0;i+l.len<=n;i++){if(l.len==2&&lp[i].end_min!=lp[i+1].start_min)continue;let ok=true;
     for(let k=0;k<l.len;k++){const j=i+k;if(cb.has(l.arm_id+':'+d+':'+j)||tb.has(l.staff_id+':'+d+':'+j)||fx(l.arm_id,d,j)||un(l.staff_id,d,j)){ok=false;break}}
     if(!ok)continue;const sc=Math.random()*3+(sd.has(l.arm_id+':'+l.subject_id+':'+d)?50:0)+dn*2;if(sc<bs){bs=sc;bd=d;bi=i}}}
   if(bs==1e9){miss.push(l);continue}
   for(let k=0;k<l.len;k++){cb.add(l.arm_id+':'+bd+':'+(bi+k));tb.add(l.staff_id+':'+bd+':'+(bi+k))}
   td[l.staff_id+':'+bd]=(td[l.staff_id+':'+bd]||0)+l.len;tw[l.staff_id]=(tw[l.staff_id]||0)+l.len;sd.add(l.arm_id+':'+l.subject_id+':'+bd);
   E.push({arm_id:l.arm_id,subject_id:l.subject_id,staff_id:l.staff_id,day:bd,start_min:lp[bi].start_min,end_min:lp[bi+l.len-1].end_min,is_double:l.len==2})}
  if(!best||miss.length<best.miss.length)best={E,miss};if(!miss.length)break}
 S.res={...best,skipped,total:L.length};draw()}
async function saveVer(){if(!S.res||!D.term[0])return msg('Generate first, and create a term in Setup',1);
 const [v]=await q(sb.from('timetable_versions').insert({term_id:D.term[0].id,label:'Generated '+new Date().toLocaleString()}).select());
 try{for(let i=0;i<S.res.E.length;i+=200)await q(sb.from('weekly_entries').insert(S.res.E.slice(i,i+200).map(e=>({...e,version_id:v.id}))))}
 catch(e){await sb.from('timetable_versions').delete().eq('id',v.id);return msg('Database rejected the timetable: '+e.message,1)}
 S.ver=v.id;S.res=null;msg('Saved as draft');await load()}
async function publish(){if(!confirm('Publish this timetable?'))return;await q(sb.from('timetable_versions').update({status:'published'}).eq('id',S.ver));msg('Published');await load()}
const fm=x=>`${String(x/60|0).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`;
const f12=x=>{const h=x/60|0;return(h>12?h-12:h)+':'+String(x%60).padStart(2,'0')};
const DF=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY'];
function grid(mode,id){const arm=mode=='class'?D.arms.find(a=>a.id==id):null,P=D.per;
 let h='<div class="sc tt">'+(D.set?.logo_url?`<img class="wm" src="${D.set.logo_url}">`:'')+'<table><tr><th>DAY</th>'+P.map((p,i)=>`<th>Slot ${i+1}</th>`).join('')+'</tr>';
 DF.forEach((dn,di)=>{const d=di+1;h+=`<tr><td class="dy">${dn}</td>`;
  P.forEach(p=>{const t=f12(p.start_min)+'-'+f12(p.end_min);
   if(p.kind!='lesson'){h+=`<td class="bk"><b>${p.label.toUpperCase()}</b><br><small>${t}</small></td>`;return}
   const fx=D.fix.find(z=>z.day==d&&z.period_no==p.period_no&&(!z.level_id||(arm&&z.level_id==arm.level_id)));
   const e=D.ent.find(z=>(mode=='class'?z.arm_id==id:z.staff_id==id)&&z.day==d&&z.start_min<=p.start_min&&z.end_min>=p.end_min);
   h+=fx?`<td class="fx"><b>${fx.label.toUpperCase()}</b><br><small>${t}</small></td>`:e?`<td><b>${sn(e.subject_id)}</b><br><small>${t}</small><br><small>${mode=='class'?nm(e.staff_id):D.arms.find(a=>a.id==e.arm_id).code}</small></td>`:`<td><small>${t}</small></td>`});
  h+='</tr>'});return h+'</table></div>'}
const pg=(mode,id)=>{const ses=D.ses.find(x=>x.id==D.term[0]?.session_id)?.name||'',who=mode=='class'?D.arms.find(a=>a.id==id).code+' TIME TABLE':'TEACHER: '+D.staff.find(t=>t.id==id).full_name.toUpperCase()+' TIME TABLE';
 return `<div class="ph">${D.set?.logo_url?`<img class="lg" src="${D.set.logo_url}">`:''}<h2>${(D.set?.name||'').toUpperCase()}</h2><i>${ses} ACADEMIC SESSION</i><br><b>${who}</b></div>`+grid(mode,id)+'<div class="pt sg">Timetable Officer: ______________ &nbsp; Principal: ______________ &nbsp; Date: ________</div>'};
function printAll(){if(!S.ver)return;const ids=S.mode=='class'?D.arms.map(a=>a.id):D.staff.filter(s=>D.ent.some(e=>e.staff_id==s.id)).map(s=>s.id);
 $('pa').innerHTML=ids.map(i=>`<section class="pg">${pg(S.mode,i)}</section>`).join('');document.body.classList.add('pall');
 window.onafterprint=()=>{document.body.classList.remove('pall');$('pa').innerHTML=''};window.print()}
async function addAv(){const lp=lessonP(),f=lp.find(p=>p.period_no==+$('avf').value),u=lp.find(p=>p.period_no==+$('avu').value);
 if(!$('avt').value||u.period_no<f.period_no)return msg('Choose a teacher and a valid period range',1);
 await q(sb.from('teacher_availability').insert({staff_id:+$('avt').value,day:+$('avd').value,start_min:f.start_min,end_min:u.end_min,kind:'unavailable'}));msg('Saved');await load()}
async function delAv(id){await q(sb.from('teacher_availability').delete().eq('id',id));await load()}
async function saveName(){await q(sb.from('school_settings').update({name:$('scn').value.trim(),logo_url:$('slg').value.trim()||null}).eq('id',1));msg('School name saved');await load()}
function draw(){const T=[['staff','Staff'],['al','Allocate'],['tt','Timetable'],['su','Setup']];
 $('nav').innerHTML=T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';draw()">${t[1]}</button>`).join('');let h='';
 if(S.tab=='staff')h=`<div class="card"><h3>Add teacher</h3><div class="row half"><input id="sn" placeholder="Staff ID"><input id="ini" placeholder="Initials"></div><div class="row"><input id="fn" placeholder="Full name"></div><div class="row half"><input id="md" type="number" placeholder="Max periods/day (6)"><input id="mw" type="number" placeholder="Max periods/week (26)"></div><b>Subjects qualified to teach</b><div>${D.subj.map(s=>`<label class="c"><input type="checkbox" class="sj" value="${s.id}">${s.code}</label>`).join('')}</div><div class="row"><button class="p" onclick="addStaff()">Save teacher</button></div></div>
 <div class="card"><h3>Teacher unavailable times</h3><div class="row"><select id="avt">${D.staff.map(t=>`<option value="${t.id}">${t.full_name}</option>`).join('')}</select><select id="avd">${DAYS.map((d,i)=>`<option value="${i+1}">${d}</option>`).join('')}</select></div><div class="row"><select id="avf">${lessonP().map(p=>`<option value="${p.period_no}">From P${p.period_no}</option>`).join('')}</select><select id="avu">${lessonP().map(p=>`<option value="${p.period_no}">To P${p.period_no}</option>`).join('')}</select><button class="p" onclick="addAv()">Add</button></div>${D.av.map(x=>`<div class="row"><small>${nm(x.staff_id)} \u00b7 ${DAYS[x.day-1]} ${fm(x.start_min)}\u2013${fm(x.end_min)}</small><button onclick="delAv(${x.id})">Remove</button></div>`).join('')}</div>
 <div class="card sc"><table><tr><th>ID</th><th>Name</th><th>Subjects</th></tr>${D.staff.map(s=>`<tr><td>${s.staff_no}</td><td>${s.full_name}</td><td>${D.qual.filter(x=>x.staff_id==s.id).map(x=>code(x.subject_id)).join(', ')}</td></tr>`).join('')}</table></div>`;
 if(S.tab=='al'){const qs=D.qual.filter(x=>x.subject_id==S.sj).map(x=>x.staff_id);
  h=`<div class="card"><h3>Allocate a subject to classes</h3><div class="row"><select id="asj" onchange="S.sj=+this.value;draw()">${D.subj.map(s=>`<option value="${s.id}" ${s.id==S.sj?'selected':''}>${s.name}</option>`).join('')}</select><select id="ate"><option value="">Choose teacher</option>${D.staff.filter(s=>qs.includes(s.id)).map(s=>`<option value="${s.id}">${s.full_name}</option>`).join('')}</select></div>
  <div class="row half"><input id="ppw" type="number" placeholder="Periods per week"><input id="dbl" type="number" placeholder="Double periods (0)"></div>
  <div class="row"><button onclick="pick('JSS')">All JSS</button><button onclick="pick('SS')">All SS</button><button onclick="pick('all')">Clear</button></div>
  <div>${D.arms.map(a=>`<label class="c"><input type="checkbox" class="ar" value="${a.id}" data-s="${a.code.startsWith('JSS')?'JSS':'SS'}">${a.code}</label>`).join('')}</div><div class="row"><button class="p" onclick="saveAlloc()">Save allocation</button></div></div>
  <div class="card sc"><b>Periods allocated per class</b> (about ${lessonP().length*5-D.fix.length} slots available)<table><tr><th>Class</th><th>Periods</th><th>Subjects</th></tr>${D.arms.map(a=>{const r=D.alloc.filter(x=>x.arm_id==a.id);return`<tr><td>${a.code}</td><td>${r.reduce((x,y)=>x+y.periods_per_week,0)}</td><td>${r.length}</td></tr>`}).join('')}</table></div>`}
 if(S.tab=='tt'){const r=S.res;h=`<div class="row"><button class="p" onclick="gen()">Generate</button><button onclick="saveVer()" ${r?'':'disabled'}>Save as draft</button><button onclick="publish()" ${S.ver?'':'disabled'}>Publish selected</button></div>`;
  if(r)h+=`<div class="card"><b class="${r.miss.length?'bad':'ok'}">${r.total-r.miss.length} of ${r.total} lessons placed</b>${r.miss.slice(0,15).map(l=>`<div class="bad">Not placed: ${D.arms.find(a=>a.id==l.arm_id).code} ${sn(l.subject_id)}</div>`).join('')}${r.skipped.length?`<div class="bad">${r.skipped.length} allocations have no teacher and were skipped</div>`:''}<small>Nothing is saved until you tap Save as draft. The database re-checks every lesson for clashes.</small></div>`;
  h+=`<div class="row"><select onchange="S.ver=+this.value;load()">${D.ver.map(v=>`<option value="${v.id}" ${v.id==S.ver?'selected':''}>#${v.id} ${v.status}: ${v.label}</option>`).join('')||'<option>No saved timetables</option>'}</select><select onchange="S.mode=this.value;draw()"><option value="class" ${S.mode=='class'?'selected':''}>Class view</option><option value="teacher" ${S.mode=='teacher'?'selected':''}>Teacher view</option></select>${S.mode=='class'?`<select onchange="S.arm=+this.value;draw()">${D.arms.map(a=>`<option value="${a.id}" ${a.id==S.arm?'selected':''}>${a.code}</option>`).join('')}</select>`:`<select onchange="S.tid=+this.value;draw()">${D.staff.map(t=>`<option value="${t.id}" ${t.id==S.tid?'selected':''}>${t.full_name}</option>`).join('')}</select>`}<button onclick="window.print()">Print / PDF</button><button onclick="printAll()">Print all</button></div><div class="card">${S.ver?pg(S.mode,S.mode=='class'?S.arm:S.tid):'Generate and save a timetable first.'}</div>`}
 if(S.tab=='su')h=`<div class="card"><h3>Setup</h3><div class="row"><input id="scn" value="${D.set?.name||''}" placeholder="School name"><input id="slg" value="${D.set?.logo_url||''}" placeholder="Logo file name, e.g. logo.png"><button class="p" onclick="saveName()">Save</button></div>Terms: ${D.term.length}<div class="row">${D.term.length?'':'<button class="p" onclick="mkTerm()">Create 2026/2027 First Term</button>'}</div><small>${D.arms.length} classes, ${D.subj.length} subjects, ${lessonP().length} lesson periods per day, ${D.fix.length} fixed activities.</small></div>`;
 $('m').innerHTML=h}
sb.auth.getSession().then(r=>r.data.session?start():loginUI());
</script></body></html>
