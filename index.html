<script>
const sb=supabase.createClient('https://gbklrppwekfdgjxlkakk.supabase.co','sb_publishable_rPRyA-2oZlE455wn_NA66w_ITWA7Gm8');
const $=id=>document.getElementById(id),DAYS=['Mon','Tue','Wed','Thu','Fri'];
const D={arms:[],subj:[],staff:[],qual:[],alloc:[],per:[],fix:[],term:[],ver:[],ent:[],av:[]};
const S={grp:'JSS standard',qa:[],ev:null,xarm:'all',xres:null,sel:null,mode:'class',tid:null,tab:'staff',arm:null,ver:null,sj:null,res:null};

async function q(p){busyOn();try{const r=await p;if(r.error){msg(r.error.message,1);throw r.error}return r.data}finally{busyOff()}}
async function load(){
 [D.arms,D.subj,D.staff,D.qual,D.alloc,D.per,D.fix,D.term,D.ver,D.av]=await Promise.all([
 q(sb.from('class_arms').select('*').order('id')),q(sb.from('subjects').select('*').order('name')),q(sb.from('staff').select('*').order('id')),
 q(sb.from('teacher_qualifications').select('*')),q(sb.from('class_subject_alloc').select('*').range(0,999)),q(sb.from('period_defs').select('*').order('day').order('start_min')),
 q(sb.from('fixed_slots').select('*')),q(sb.from('terms').select('*')),q(sb.from('timetable_versions').select('*').order('id',{ascending:false})),q(sb.from('teacher_availability').select('*'))]);
 D.staffAll=D.staff;D.staff=D.staff.filter(s=>s.is_active);D.set=(await q(sb.from('school_settings').select('*')))[0];D.ses=await q(sb.from('academic_sessions').select('*'));if(!S.tid)S.tid=D.staff[0]?.id;if(!S.arm)S.arm=D.arms[0]?.id;if(!S.sj)S.sj=D.subj[0]?.id;if(!S.ver&&D.ver[0])S.ver=D.ver[0].id;
 D.ent=S.ver?await q(sb.from('weekly_entries').select('*').eq('version_id',S.ver).range(0,999)):[];await loadEx();draw()}
function loginUI(){$('nav').innerHTML='';$('m').innerHTML=`<div class="card"><h3>Log in</h3><div class="row"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="p" onclick="login()">Log in</button></div></div>`}
async function login(){busyOn('Logging in...');const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});busyOff();if(r.error)return msg(r.error.message,1);msg('');start()}
async function start(){$('out').style.display='';await load()}
const perFor=d=>{const k=D.per.some(p=>p.day==d)?d:0;return D.per.filter(p=>p.day==k).sort((a,b)=>a.start_min-b.start_min)};
const lessonP=(d=1)=>perFor(d).filter(p=>p.kind=='lesson');
const nm=id=>D.staffAll.find(s=>s.id==id)?.initials||D.staffAll.find(s=>s.id==id)?.full_name||'?';
const code=id=>D.subj.find(s=>s.id==id)?.code,sn=id=>D.subj.find(s=>s.id==id)?.name;
async function addStaff(){const v=i=>$(i).value.trim();if(!v('sn')||!v('fn'))return msg('Staff ID and full name are required',1);
 const [s]=await q(sb.from('staff').insert({staff_no:v('sn'),full_name:v('fn'),initials:v('ini')||null,max_periods_day:+v('md')||6,max_periods_week:+v('mw')||26}).select());
 const ids=[...document.querySelectorAll('.sj:checked')].map(c=>+c.value);
 if(ids.length)await q(sb.from('teacher_qualifications').insert(ids.map(i=>({staff_id:s.id,subject_id:i}))));
 msg('Saved '+v('fn'));await load()}
function pick(sec){document.querySelectorAll('.ar').forEach(c=>c.checked=sec=='all'?false:c.dataset.s==sec)}
async function mkTerm(){const [a]=await q(sb.from('academic_sessions').insert({name:'2026/2027',is_current:true}).select());
 await q(sb.from('terms').insert({session_id:a.id,name:'First Term',start_date:'2026-09-14',end_date:'2026-12-18'}));msg('Term created');await load()}
function gen(){busyOn('Generating timetable...');setTimeout(()=>{try{genRun()}finally{busyOff()}},60)}
function genRun(){const LP={1:lessonP(1),2:lessonP(2),3:lessonP(3),4:lessonP(4),5:lessonP(5)},n=LP[1].length,st=Object.fromEntries(D.staff.map(s=>[s.id,s])),armOf=Object.fromEntries(D.arms.map(a=>[a.id,a]));
 const fx=(a,d,i)=>D.fix.some(f=>f.day==d&&(!f.level_id||f.level_id==armOf[a].level_id)&&LP[d][i].period_no==f.period_no);
 const un=(s,d,i)=>D.av.some(x=>x.staff_id==s&&x.kind=='unavailable'&&x.day==d&&x.start_min<LP[d][i].end_min&&x.end_min>LP[d][i].start_min);
 const L=[],skipped=[];D.alloc.forEach(a=>{if(!a.staff_id){skipped.push(a);return}for(let k=0;k<a.double_blocks;k++)L.push({...a,len:2});for(let k=0;k<a.periods_per_week-2*a.double_blocks;k++)L.push({...a,len:1})});
 const lk=D.ent.filter(e=>e.locked),L2=L.slice();
 lk.forEach(e=>{const len=e.is_double?2:1,k=L2.findIndex(l=>l.arm_id==e.arm_id&&l.subject_id==e.subject_id&&l.len==len);
  if(k>=0)L2.splice(k,1);else for(let c=0;c<len;c++){const j=L2.findIndex(l=>l.arm_id==e.arm_id&&l.subject_id==e.subject_id&&l.len==1);if(j>=0)L2.splice(j,1)}});
 let best=null;
 for(let t=0;t<40;t++){const cb=new Set,tb=new Set,td={},tw={},sd=new Set,E=[],miss=[];
  lk.forEach(e=>{const bi=LP[e.day].findIndex(p=>p.start_min==e.start_min),len=e.is_double?2:1;for(let k=0;k<len;k++){cb.add(e.arm_id+':'+e.day+':'+(bi+k));tb.add(e.staff_id+':'+e.day+':'+(bi+k))}
   td[e.staff_id+':'+e.day]=(td[e.staff_id+':'+e.day]||0)+len;tw[e.staff_id]=(tw[e.staff_id]||0)+len;sd.add(e.arm_id+':'+e.subject_id+':'+e.day);
   E.push({arm_id:e.arm_id,subject_id:e.subject_id,staff_id:e.staff_id,day:e.day,start_min:e.start_min,end_min:e.end_min,is_double:e.is_double,locked:true})});
  const Q=L2.map(x=>x).sort(()=>Math.random()-.5).sort((x,y)=>y.len-x.len);
  for(const l of Q){const sf=st[l.staff_id],md=sf.max_periods_day||99,mw=sf.max_periods_week||99;let bs=1e9,bd,bi;
   if((tw[l.staff_id]||0)+l.len<=mw)for(let d=1;d<=5;d++){const dn=td[l.staff_id+':'+d]||0;if(dn+l.len>md)continue;
    for(let i=0;i+l.len<=n;i++){if(l.len==2&&LP[d][i].end_min!=LP[d][i+1].start_min)continue;let ok=true;
     for(let k=0;k<l.len;k++){const j=i+k;if(cb.has(l.arm_id+':'+d+':'+j)||tb.has(l.staff_id+':'+d+':'+j)||fx(l.arm_id,d,j)||un(l.staff_id,d,j)){ok=false;break}}
     if(!ok)continue;const sc=Math.random()*3+(sd.has(l.arm_id+':'+l.subject_id+':'+d)?50:0)+dn*2;if(sc<bs){bs=sc;bd=d;bi=i}}}
   if(bs==1e9){miss.push(l);continue}
   for(let k=0;k<l.len;k++){cb.add(l.arm_id+':'+bd+':'+(bi+k));tb.add(l.staff_id+':'+bd+':'+(bi+k))}
   td[l.staff_id+':'+bd]=(td[l.staff_id+':'+bd]||0)+l.len;tw[l.staff_id]=(tw[l.staff_id]||0)+l.len;sd.add(l.arm_id+':'+l.subject_id+':'+bd);
   E.push({arm_id:l.arm_id,subject_id:l.subject_id,staff_id:l.staff_id,day:bd,start_min:LP[bd][bi].start_min,end_min:LP[bd][bi+l.len-1].end_min,is_double:l.len==2})}
  if(!best||miss.length<best.miss.length)best={E,miss};if(!miss.length)break}
 S.res={...best,skipped,total:L.length,clashes:verify(best.E)};draw()}
function verify(E){const out=[],cl=id=>D.arms.find(a=>a.id==id).code;
 const chk=(key,txt)=>{const g={};E.forEach(e=>(g[key(e)]=g[key(e)]||[]).push(e));for(const k in g){const r=g[k].sort((a,b)=>a.start_min-b.start_min);for(let i=1;i<r.length;i++)if(r[i].start_min<r[i-1].end_min)out.push(txt(r[i-1],r[i]))}};
 chk(e=>e.staff_id+':'+e.day,(a,b)=>`Teacher ${nm(a.staff_id)} is in ${cl(a.arm_id)} and ${cl(b.arm_id)} on ${DF[a.day-1]} at ${f12(b.start_min)}`);
 chk(e=>e.arm_id+':'+e.day,(a,b)=>`Class ${cl(a.arm_id)} has two lessons on ${DF[a.day-1]} at ${f12(b.start_min)}`);
 return out}
async function saveVer(){if(!S.res||!D.term[0])return msg('Generate first, and create a term in Setup',1);if(S.res.clashes.length)return msg('Not saved: the timetable has clashes',1);
 const [v]=await q(sb.from('timetable_versions').insert({term_id:D.term[0].id,label:'Generated '+new Date().toLocaleString()}).select());
 try{for(let i=0;i<S.res.E.length;i+=200)await q(sb.from('weekly_entries').insert(S.res.E.slice(i,i+200).map(e=>({...e,version_id:v.id}))))}
 catch(e){await sb.from('timetable_versions').delete().eq('id',v.id);return msg('Database rejected the timetable: '+e.message,1)}
 S.ver=v.id;S.res=null;msg('Saved as draft');await load()}
async function publish(){if(!confirm('Publish this timetable?'))return;await q(sb.from('timetable_versions').update({status:'published'}).eq('id',S.ver));msg('Published');await load()}
const fm=x=>`${String(x/60|0).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`;
const f12=x=>{const h=x/60|0;return(h>12?h-12:h)+':'+String(x%60).padStart(2,'0')};
const DF=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY'];
function grid(mode,id){const arm=mode=='class'?D.arms.find(a=>a.id==id):null,P1=perFor(1);
 let h='<div class="sc tt">'+(D.set?.logo_url?`<img class="wm" src="${D.set.logo_url}">`:'')+'<table><tr><th>DAY</th>'+P1.map((p,i)=>`<th>Slot ${i+1}</th>`).join('')+'</tr>';
 DF.forEach((dn,di)=>{const d=di+1;h+=`<tr><td class="dy">${dn}</td>`;
  perFor(d).forEach(p=>{const t=f12(p.start_min)+'-'+f12(p.end_min);
   if(p.kind!='lesson'){h+=`<td class="bk"><b>${p.label.toUpperCase()}</b><br><small>${t}</small></td>`;return}
   const fx=D.fix.find(z=>z.day==d&&z.period_no==p.period_no&&(!z.level_id||(arm&&z.level_id==arm.level_id)));
   const e=D.ent.find(z=>(mode=='class'?z.arm_id==id:z.staff_id==id)&&z.day==d&&z.start_min<=p.start_min&&z.end_min>=p.end_min);
   h+=fx?`<td class="fx"><b>${fx.label.toUpperCase()}</b><br><small>${t}</small></td>`:e?`<td${mode=='class'?` class="${S.sel==e.id?'sel':''}" onclick="selCell(${e.id})"`:''}><b>${sn(e.subject_id)}${e.locked?' 🔒':''}</b><br><small>${t}</small><br><small>${mode=='class'?nm(e.staff_id):D.arms.find(a=>a.id==e.arm_id).code}</small></td>`:`<td${mode=='class'&&S.sel?` onclick="moveTo(${d},${p.period_no})"`:''}><small>${t}</small></td>`});
  h+='</tr>'});return h+'</table></div>'}
const pg=(mode,id)=>{const ses=D.ses.find(x=>x.id==D.term[0]?.session_id)?.name||'',who=mode=='class'?D.arms.find(a=>a.id==id).code+' TIME TABLE':'TEACHER: '+D.staff.find(t=>t.id==id).full_name.toUpperCase()+' TIME TABLE';
 return `<div class="ph">${D.set?.logo_url?`<img class="lg" src="${D.set.logo_url}">`:''}<h2>${(D.set?.name||'').toUpperCase()}</h2><i>${ses} ACADEMIC SESSION</i><br><b>${who}</b></div>`+grid(mode,id)+'<div class="pt sg">Timetable Officer: ______________ &nbsp; Principal: ______________ &nbsp; Date: ________</div>'};
function printAll(){if(!S.ver)return;const ids=S.mode=='class'?D.arms.map(a=>a.id):D.staff.filter(s=>D.ent.some(e=>e.staff_id==s.id)).map(s=>s.id);
 $('pa').innerHTML=ids.map(i=>`<section class="pg">${pg(S.mode,i)}</section>`).join('');document.body.classList.add('pall');
 window.onafterprint=()=>{document.body.classList.remove('pall');$('pa').innerHTML=''};window.print()}
async function addAv(){const lp=lessonP(+$('avd').value),f=lp.find(p=>p.period_no==+$('avf').value),u=lp.find(p=>p.period_no==+$('avu').value);
 if(!$('avt').value||u.period_no<f.period_no)return msg('Choose a teacher and a valid period range',1);
 await q(sb.from('teacher_availability').insert({staff_id:+$('avt').value,day:+$('avd').value,start_min:f.start_min,end_min:u.end_min,kind:'unavailable'}));msg('Saved');await load()}
async function delStaff(id){const t=D.staff.find(x=>x.id==id),n=D.alloc.filter(a=>a.staff_id==id).length;
 if(!confirm('Remove '+t.full_name+'?'+(n?' Their '+n+' class subjects will have no teacher until you allocate them again.':'')))return;
 await q(sb.from('class_subject_alloc').update({staff_id:null}).eq('staff_id',id));
 busyOn();const r=await sb.from('staff').delete().eq('id',id);busyOff();
 if(r.error){if(r.error.code=='23503'){await q(sb.from('staff').update({is_active:false}).eq('id',id));msg(t.full_name+' appears in a saved timetable, so was hidden instead of deleted')}else return msg(r.error.message,1)}

 await load()}
function selCell(id){S.sel=S.sel==id?null:id;draw()}
function selBar(){const e=D.ent.find(x=>x.id==S.sel);if(!e||S.mode!='class')return S.mode=='class'?'<div class="card"><small>Tap a lesson to move or lock it.</small></div>':'';

 await q(sb.from('weekly_entries').update({day:d,start_min:lp[i].start_min,end_min:last.end_min}).eq('id',e.id));S.sel=null;msg('Lesson moved');await load()}

function draw(){const T=[['staff','Staff'],['al','Allocate'],['tt','Timetable'],['ex','Exams'],['su','Setup']];
 $('nav').innerHTML=T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';draw()">${t[1]}</button>`).join('');let h='';

async function loadEx(){D.ev=await q(sb.from('assessment_events').select('*').order('id',{ascending:false}));D.rooms=await q(sb.from('rooms').select('*').order('name'));
 if(!S.ev&&D.ev[0])S.ev=D.ev[0].id;
 if(S.ev){[D.asess,D.req,D.sit,D.xent,D.inv]=await Promise.all([q(sb.from('assessment_sessions').select('*').eq('event_id',S.ev).order('session_no')),q(sb.from('assessment_requirements').select('*').eq('event_id',S.ev).range(0,999)),q(sb.from('assessment_sittings').select('*').eq('event_id',S.ev).range(0,999)),q(sb.from('assessment_entries').select('*').eq('event_id',S.ev).range(0,999)),q(sb.from('invigilations').select('*').range(0,999))]);
  D.inv=D.inv.filter(i=>D.sit.some(s=>s.id==i.sitting_id))}else{D.asess=[];D.req=[];D.sit=[];D.xent=[];D.inv=[]}}
async function mkEvent(){const g=i=>$(i).value;if(!g('evn')||!g('evs')||!g('eve'))return msg('Fill the name and both dates',1);if(!D.term[0])return msg('Create a term in Setup first',1);
 const [e]=await q(sb.from('assessment_events').insert({term_id:D.term[0].id,kind:g('evk'),name:g('evn'),start_date:g('evs'),end_date:g('eve')}).select());S.ev=e.id;S.xres=null;msg('Created');await load()}

async function copyFrom(){const src=+$('cps').value;if(!src)return;if(!confirm('Copy sessions and papers from that assessment? Dates are not copied.'))return;
 const [ss,rq]=await Promise.all([q(sb.from('assessment_sessions').select('*').eq('event_id',src)),q(sb.from('assessment_requirements').select('*').eq('event_id',src).range(0,999))]);
 await q(sb.from('assessment_sessions').delete().eq('event_id',S.ev));await q(sb.from('assessment_requirements').delete().eq('event_id',S.ev));
 if(ss.length)await q(sb.from('assessment_sessions').insert(ss.map(x=>({event_id:S.ev,session_no:x.session_no,start_min:x.start_min,end_min:x.end_min}))));

function genExam(){busyOn('Generating...');setTimeout(()=>{try{genExamRun()}finally{busyOff()}},60)}
function genExamRun(){const ev=D.ev.find(e=>e.id==S.ev);if(!ev)return;
 const days=[];for(let d=new Date(ev.start_date+'T00:00:00Z');d<=new Date(ev.end_date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1)){const w=d.getUTCDay();if(w>=1&&w<=5)days.push(d.toISOString().slice(0,10))}
 const ses=D.asess;if(!ses.length||!D.req.length||!D.rooms.length||!D.staff.length)return msg('Add daily sittings, rooms and papers first, and make sure teachers exist',1);
 const armBy=Object.fromEntries(D.arms.map(a=>[a.id,a])),busy={},rb={},dayN={},slotN={},sit=[],miss=[];
 const ov=(m,k,s,e)=>(m[k]||[]).some(x=>s<x[1]&&e>x[0]),add=(m,k,s,e)=>(m[k]=m[k]||[]).push([s,e]);
 for(const r of D.req.slice().sort(()=>Math.random()-.5)){let best=null,bs=1e9;
  for(const date of days)for(const se of ses){const s=se.start_min,e=s+r.duration_min;if(e>se.end_min)continue;
   if(ov(busy,r.arm_id+'|'+date,s,e)||(slotN[date+'|'+s]||0)>=D.staff.length)continue;
   const own=D.rooms.find(x=>x.name==armBy[r.arm_id].code),room=own&&!ov(rb,own.id+'|'+date,s,e)?own:D.rooms.find(x=>!ov(rb,x.id+'|'+date,s,e));if(!room)continue;
   const sc=(dayN[r.arm_id+'|'+date]||0)*50+Math.random()*2+days.indexOf(date)*.1;if(sc<bs){bs=sc;best={date,s,e,room:room.id}}}
  if(!best){miss.push(r);continue}
  add(busy,r.arm_id+'|'+best.date,best.s,best.e);add(rb,best.room+'|'+best.date,best.s,best.e);dayN[r.arm_id+'|'+best.date]=(dayN[r.arm_id+'|'+best.date]||0)+1;slotN[best.date+'|'+best.s]=(slotN[best.date+'|'+best.s]||0)+1;
  sit.push({arm_id:r.arm_id,subject_id:r.subject_id,date:best.date,start_min:best.s,end_min:best.e,room_id:best.room})}
 const ib={},cnt={};D.staff.forEach(t=>cnt[t.id]=0);
 sit.sort((a,b)=>a.date.localeCompare(b.date)||a.start_min-b.start_min).forEach(x=>{
  const own=D.alloc.find(a=>a.arm_id==x.arm_id&&a.subject_id==x.subject_id)?.staff_id;
  const c=D.staff.filter(t=>!ov(ib,t.id+'|'+x.date,x.start_min,x.end_min)).sort((a,b)=>((a.id==own)-(b.id==own))||cnt[a.id]-cnt[b.id]);
  if(c[0]){x.staff_id=c[0].id;cnt[c[0].id]++;add(ib,c[0].id+'|'+x.date,x.start_min,x.end_min)}});
 S.xres={sit,miss,clash:verifyEx(sit),noinv:sit.filter(x=>!x.staff_id).length};draw()}
function verifyEx(sit){const out=[],cl=id=>D.arms.find(a=>a.id==id).code;
 const chk=(key,txt)=>{const g={};sit.forEach(x=>{const k=key(x);if(k)(g[k]=g[k]||[]).push(x)});for(const k in g){const r=g[k].sort((a,b)=>a.start_min-b.start_min);for(let i=1;i<r.length;i++)if(r[i].start_min<r[i-1].end_min)out.push(txt(r[i]))}};
 chk(x=>x.arm_id+'|'+x.date,x=>`${cl(x.arm_id)} has two papers at once on ${dfmt(x.date)}`);
 chk(x=>x.room_id+'|'+x.date,x=>`A room is double-booked on ${dfmt(x.date)} at ${f12(x.start_min)}`);
 chk(x=>x.staff_id?x.staff_id+'|'+x.date:null,x=>`${nm(x.staff_id)} invigilates two papers at once on ${dfmt(x.date)}`);return out}
async function saveExam(){const r=S.xres;if(!r)return;if(r.clash.length)return msg('Not saved: the timetable has clashes',1);
 if(D.sit.length&&!confirm('Replace the saved timetable for this assessment?'))return;
 try{await q(sb.from('assessment_sittings').delete().eq('event_id',S.ev));
  const rows=r.sit.map(x=>({event_id:S.ev,subject_id:x.subject_id,room_id:x.room_id,exam_date:x.date,start_min:x.start_min,end_min:x.end_min})),ids=[];
  for(let i=0;i<rows.length;i+=150){const d=await q(sb.from('assessment_sittings').insert(rows.slice(i,i+150)).select('id'));d.sort((a,b)=>a.id-b.id).forEach(x=>ids.push(x.id))}
  const ents=r.sit.map((x,i)=>({event_id:S.ev,arm_id:x.arm_id,sitting_id:ids[i]})),inv=r.sit.map((x,i)=>x.staff_id?{sitting_id:ids[i],staff_id:x.staff_id}:null).filter(Boolean);
  for(let i=0;i<ents.length;i+=150)await q(sb.from('assessment_entries').insert(ents.slice(i,i+150)));
  for(let i=0;i<inv.length;i+=150)await q(sb.from('invigilations').insert(inv.slice(i,i+150)));
 }catch(e){await sb.from('assessment_sittings').delete().eq('event_id',S.ev);return msg('Database rejected it: '+e.message,1)}
 S.xres=null;msg('Saved as draft');await load()}
async function pubExam(){const u=await q(sb.from('v_unscheduled_assessments').select('*').eq('event_id',S.ev));
 if(u.length)return msg(u.length+' papers are still not scheduled',1);if(!D.xent.length)return msg('Save a timetable first',1);
 if(!confirm('Publish this timetable?'))return;await q(sb.from('assessment_events').update({status:'published'}).eq('id',S.ev));msg('Published');await load()}

 let h=`<div class="card"><h3>New assessment</h3><div class="row half"><select id="evk">${Object.entries(KIND).map(([k,v])=>opt(k,v)).join('')}</select><input id="evn" placeholder="Name, e.g. First CA"></div><div class="row half"><input id="evs" type="date"><input id="eve" type="date"></div><div class="row"><button class="p" onclick="mkEvent()">Create</button></div></div>`;

 h+=`<div class="card"><h3>1. Daily sittings</h3>${D.asess.map(s=>`<div class="row"><small>Sitting ${s.session_no}: ${f12(s.start_min)}-${f12(s.end_min)}</small><button onclick="delSess(${s.id})">Remove</button></div>`).join('')}<div class="row"><input id="ss1" type="time" value="08:00"><input id="ss2" type="time" value="10:00"><button class="p" onclick="addSess()">Add</button></div></div>`;

function pickQ(sec){document.querySelectorAll('.qa').forEach(c=>c.checked=sec=='all'?false:c.dataset.s==sec)}
function quickCard(){const g=GR[S.grp]||[],sel=S.qa||[];
 return `<div class="card"><h3>1. Set up class subjects</h3><small>Pick a group, adjust the periods, tick the classes, then Apply. Teachers already assigned are kept.</small><div class="row"><select onchange="S.qa=[...document.querySelectorAll('.qa:checked')].map(c=>+c.value);S.grp=this.value;draw()">${Object.keys(GR).map(k=>`<option ${k==S.grp?'selected':''}>${k}</option>`).join('')}</select></div>
 ${g.map(([c,p,d])=>{const sj=D.subj.find(x=>x.code==c);return sj?`<div class="row qrow" data-c="${c}"><label class="c"><input type="checkbox" class="qs" checked>${sj.name}</label><input class="qp" type="number" value="${p}" style="width:70px"><small>periods</small><input class="qd" type="number" value="${d}" style="width:70px"><small>double</small></div>`:''}).join('')}
 <div class="row"><button onclick="pickQ('JSS')">All JSS</button><button onclick="pickQ('SS')">All SS</button><button onclick="pickQ('all')">Clear</button></div><div>${D.arms.map(a=>`<label class="c"><input type="checkbox" class="qa" value="${a.id}" data-s="${a.code.startsWith('JSS')?'JSS':'SS'}" ${sel.includes(a.id)?'checked':''}>${a.code}</label>`).join('')}</div><div class="row"><button class="p" onclick="applyGroup()">Apply to ticked classes</button></div></div>`}
function unHTML(){const m={};D.alloc.filter(a=>!a.staff_id).forEach(a=>m[a.subject_id]=(m[a.subject_id]||0)+1);const k=Object.keys(m);if(!k.length)return'';
 return `<div class="card"><b class="bad">Still need a teacher</b>${k.map(i=>`<div class="bad">${sn(+i)}: ${m[i]} classes</div>`).join('')}</div>`}
async function applyGroup(){const arms=[...document.querySelectorAll('.qa:checked')].map(c=>+c.value),rows=[],miss=[];S.qa=arms;
 if(!arms.length)return msg('Tick the classes first',1);
 document.querySelectorAll('.qrow').forEach(r=>{if(!r.querySelector('.qs').checked)return;const sj=D.subj.find(x=>x.code==r.dataset.c);if(!sj){miss.push(r.dataset.c);return}
  const p=+r.querySelector('.qp').value;if(!p)return;const d=Math.min(+r.querySelector('.qd').value||0,p>>1);arms.forEach(a=>rows.push({arm_id:a,subject_id:sj.id,periods_per_week:p,double_blocks:d}))});
 if(!rows.length)return msg('Nothing to apply',1);
 for(let i=0;i<rows.length;i+=300)await q(sb.from('class_subject_alloc').upsert(rows.slice(i,i+300),{onConflict:'arm_id,subject_id'}));
 msg(rows.length+' class subjects saved. Now assign teachers in step 2.');await load()}
async function saveAlloc(){const sid=+$('asj').value,tid=+$('ate').value,ppw=+$('ppw').value,dv=$('dbl').value;
 const arms=[...document.querySelectorAll('.ar:checked')].map(c=>+c.value);
 if(!tid||!arms.length)return msg('Choose a teacher and at least one class',1);
 const rows=[],none=[];arms.forEach(a=>{const ex=D.alloc.find(x=>x.arm_id==a&&x.subject_id==sid),p=ppw||ex?.periods_per_week;
  if(!p){none.push(D.arms.find(x=>x.id==a).code);return}rows.push({arm_id:a,subject_id:sid,staff_id:tid,periods_per_week:p,double_blocks:dv!==''?+dv:(ex?ex.double_blocks:0)})});
 if(!rows.length)return msg('Enter periods per week, or set up the class subjects in step 1 first',1);
 await q(sb.from('class_subject_alloc').upsert(rows,{onConflict:'arm_id,subject_id'}));
 msg('Saved '+rows.length+' allocations'+(none.length?'. No periods set for: '+none.join(', '):''));await load()}

busyOn();sb.auth.getSession().then(r=>{busyOff();r.data.session?start():loginUI()});
</script></body></html>
